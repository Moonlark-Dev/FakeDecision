name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build frontend
        working-directory: frontend
        run: pnpm build
      - name: Backend tests
        run: python -m pytest -q
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: fakedecision-web-dist
          path: backend/fake_decision/web/dist
          retention-days: 7

  executable:
    name: Nuitka executable (linux x86_64)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (system Python for baseline CPU ISA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf ccache python3-venv python3-dev
          python3 -m venv .venv-build
          . .venv-build/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements-build.txt
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: fakedecision-web-dist
          path: backend/fake_decision/web/dist
      - name: Build standalone executable
        env:
          SKIP_FRONTEND_BUILD: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          . .venv-build/bin/activate
          bash scripts/build_executable.sh
      - name: Verify binary starts and CPU baseline
        run: |
          tar -xzf dist/FakeDecision-linux-x86_64.tar.gz -C /tmp
          readelf -n /tmp/FakeDecision-linux-x86_64/fakedecision | tee /tmp/fd-isa.txt
          if grep -q 'x86-64-v3' /tmp/fd-isa.txt; then
            echo 'ERROR: artifact requires x86-64-v3; build must target baseline CPUs' >&2
            exit 1
          fi
          /tmp/FakeDecision-linux-x86_64/fakedecision --version
          /tmp/FakeDecision-linux-x86_64/fakedecision --init-only --data-dir /tmp/fd-ci-init --admin-password 'CiOnly!Password123' | tail -5
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeDecision-linux-x86_64
          path: |
            dist/FakeDecision-linux-x86_64.tar.gz
            dist/FakeDecision-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
